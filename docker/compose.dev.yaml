# Dev overlay (`make dev`): the same one service, from the Dockerfile's `dev`
# target, with the sources bind-mounted. docker/dev.sh runs the control UI
# (`vite dev` on 127.0.0.1:8090, where Caddy expects control) and the runner
# (`cargo watch`); the runner supervises Caddy and the tenant fleets as in
# prod. Never run dev and prod at once: same project, ports and volumes.
services:
  noite:
    image: noite-dev:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - ../apps/runner:/src:z
      - ../apps/noite:/app:z
      - ../docker/dev.sh:/opt/noite/dev.sh:ro,z
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - runner-target:/src/target
      - bun-cache:/root/.bun/install/cache
      # The vite optimizer cache holds absolute paths: host runs write
      # /home/<user>/…, the container sees /app/…, so it keeps its own.
      - vite-cache:/app/node_modules/.vite
    environment:
      RUST_LOG: ${RUST_LOG:-noite_runner=debug,tower_http=info}
      # Dev stacks never report (SPEC, telemetry).
      NOITE_TELEMETRY: "0"
      RUNNER_DEV_RELEASE: ${RUNNER_DEV_RELEASE:-0}
      # 1 = polling file watcher (flaky rootless inotify).
      VITE_USE_POLLING: ${VITE_USE_POLLING:-0}
      # Worker bindings from this container's environment: wrangler's dev-var
      # loader reads `.dev.vars`/`.env` only unless this is exactly "true",
      # and without it every /api/auth/* call answers 500 "BETTER_AUTH_SECRET
      # is missing". `apps/noite/.dev.vars` still wins when present.
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
    healthcheck:
      # The first boot compiles the runner and installs UI deps: minutes.
      start_period: 900s

volumes:
  cargo-registry:
  cargo-git:
  runner-target:
  bun-cache:
  vite-cache:
