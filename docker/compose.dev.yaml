# Dev overlay: runner cargo-watch + Oxide Vite HMR.
#   make dev
# ui flips back to the tools image + source bind mount + docker/noite.sh
# (HMR); prod compose uses the immutable docker/Dockerfile.control image.
services:
  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner-dev
    image: noite-runner-dev:local
    volumes:
      - ../apps/runner:/src
      - ../docker/runner-dev.sh:/runner-dev.sh:ro
      - runner-cargo-registry:/usr/local/cargo/registry
      - runner-cargo-git:/usr/local/cargo/git
      - runner-target:/src/target
      - agent-data:/data
      - caddy-config:/caddy
    working_dir: /src
    environment:
      RUST_LOG: ${RUST_LOG:-noite_runner=debug,tower_http=info}
      CARGO_TERM_COLOR: always
      RUNNER_DEV_RELEASE: ${RUNNER_DEV_RELEASE:-0}
    command: ["/bin/sh", "/runner-dev.sh"]
    healthcheck:
      # Debug compile on first boot can take minutes — start_period covers
      # it; afterwards fleets must be spawned (/ready) before dependents start.
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tools
    image: noite-tools:local
    working_dir: /app
    environment:
      NOITE_MODE: ${NOITE_MODE:-dev}
      # Instance admin bootstrap address (empty = disabled).
      NOITE_ADMIN_EMAIL: ${NOITE_ADMIN_EMAIL:-}
      # 1 = polling file watcher (flaky rootless inotify).
      VITE_USE_POLLING: ${VITE_USE_POLLING:-0}
    depends_on:
      runner:
        condition: service_healthy
    volumes:
      - ../apps/noite:/app
      - ../docker/noite.sh:/noite.sh:ro
      - ../docker/noite-dev.sh:/noite-dev.sh:ro
      - ui-data:/data
      - bun-cache:/root/.bun/install/cache
    command: ["/bin/sh", "/noite.sh"]

volumes:
  runner-cargo-registry:
  runner-cargo-git:
  runner-target:
  bun-cache:
