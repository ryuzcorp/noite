# Dev overlay: same 4 services as prod (`docker/compose.yaml`), dev processes.
# `control` runs `vite dev` (real Oxide + Cloudflare plugin pipeline: workerd,
# local D1, HMR) instead of the celld node's deployed bundle, and `runner` runs
# cargo-watch against a bind-mounted source tree.
#
#   make dev
#
# Secrets for the vite process come from apps/noite/.dev.vars (auto-loaded).
# Never run dev and prod at once — same container names, ports and volumes.
services:
  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner-dev
    image: noite-runner-dev:local
    # hostname/restart/networks/healthcheck/env/volume for runner state all
    # come from the prod service — dev only replaces what differs.
    volumes:
      - ../apps/runner:/src:z
      - ../docker/runner-dev.sh:/runner-dev.sh:ro,z
      - runner-cargo-registry:/usr/local/cargo/registry
      - runner-cargo-git:/usr/local/cargo/git
      - runner-target:/src/target
    working_dir: /src
    environment:
      RUST_LOG: ${RUST_LOG:-noite_runner=debug,tower_http=info}
      CARGO_TERM_COLOR: always
      RUNNER_DEV_RELEASE: ${RUNNER_DEV_RELEASE:-0}
    command: ["/bin/sh", "/runner-dev.sh"]
    healthcheck:
      # Debug compile on first boot takes minutes — the prod start_period
      # (60s) would flap, and caddy waits on this gate.
      test: ["CMD", "curl", "-fs", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

  control:
    # Dev flavor of the prod celld node: tools image + source bind mount +
    # docker/control-dev.sh (`vite dev`).
    build:
      context: ..
      dockerfile: docker/Dockerfile.tools
    image: noite-tools:local
    # Reset the image entrypoint (the UI image deploys a bundle and execs
    # celld; dev runs vite) — `entrypoint: []` restores the image default.
    entrypoint: []
    environment:
      PORT: "8090"
      # 1 = polling file watcher (flaky rootless inotify).
      VITE_USE_POLLING: ${VITE_USE_POLLING:-0}
      # Marks the dev lane for `make doctor`: this container serves the UI with
      # `vite dev`, so the celld node checks do not apply to it.
      NOITE_DEV: "1"
    volumes:
      - ../apps/noite:/app:z
      - ../docker/control-dev.sh:/control-dev.sh:ro,z
      - bun-cache:/root/.bun/install/cache
      # Vite optimizer cache holds absolute paths: host runs write
      # /home/<user>/…, the container sees /app/…, and sharing it poisons
      # worker-entry analysis — so the container keeps its own warm cache.
      - vite-cache:/app/node_modules/.vite
    command: ["/bin/sh", "/control-dev.sh"]
    healthcheck:
      # Dev serves the UI with `vite dev`, not a celld node, so the base
      # service's documented celld health path cannot answer here. Gate on the
      # dev server itself; the first boot also runs `bun install`.
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8090/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  # Dev-only build caches.
  runner-cargo-registry:
  runner-cargo-git:
  runner-target:
  bun-cache:
  vite-cache:
