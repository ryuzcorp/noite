# Local pre-release overlay (`make e2e` / `make up-e2e`, via docker/e2e-local.sh).
#
# The runner container cell is provisioned by celld at `celld deploy` time
# through an engine socket. The base file deliberately has no socket mount
# (a missing source breaks `make up` on rootless podman, which has no
# socket at the Docker path; see standalone.ts for the release
# equivalent) — this overlay adds it and points DOCKER_HOST at it.
services:
  control:
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Whole repo (read-only): bun workspaces hoist shared deps to the
      # root node_modules and link members relatively (../../node_modules),
      # so mounting only apps/noite leaves DANGLING symlinks in-container
      # (visible to ls, unresolvable to esbuild). The root mount preserves
      # the exact layout `celld deploy` assumes; deploy runs with CWD at
      # /repo/apps/noite, mirroring the laptop flow.
      - ..:/repo:ro
