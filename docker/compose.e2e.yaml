# E2E lane (`make e2e`, docker/e2e-local.sh): its own project and bucket, raw
# ports for the Playwright helpers. The control UI is reached through Caddy
# (the lane sets HTTP_PORT, so http://noite.localhost:<port> serves it); the
# runner API and Git on the lane's API port; tenant fleets on their own
# ports. Parallel lanes (E2E_SLOT) override every host-side value below
# through the environment: slot 0 leaves every default in place, so its
# rendered config is byte-identical to the unparameterized file.
services:
  noite:
    ports:
      - "${E2E_API_PORT:-8080}:8080"
      - "${E2E_FLEET_RANGE:-20000-20099:20000-20099}"
    environment:
      NOITE_S3_BUCKET: ${E2E_BUCKET:-noite-e2e}
      # The e2e lane never reports (SPEC, telemetry).
      NOITE_TELEMETRY: "0"
      BETTER_AUTH_URL: ${E2E_BASE_URL:-http://noite.localhost:8090}
      GIT_PUBLIC_BASE: ${E2E_GIT_BASE:-http://localhost:8080/v1/git}
      S3_PUBLIC_ENDPOINT: http://localhost:${RUSTFS_API_PORT:-19000}
      # No proxy in front of the lane: every request shares one client key.
      NOITE_RATE_LIMIT_RPM: "100000"
      NOITE_AUTH_RATE_LIMIT: "100000"
      NOITE_EDGE_RPM: "0"
      NOITE_EDGE_GIT_RPM: "0"
      # `E2E_TENANCY=multi` runs the isolation lane (hostile tenant spec).
      NOITE_TENANCY: ${E2E_TENANCY:-single}
      # Spec files run in parallel (E2E_WORKERS) and each holds its apps until
      # its afterAll: peak live apps are workers × per-file holdings (prs and
      # source-tree each hold up to 6), far above the default quota of 10.
      # Lane-only: the bucket, volumes and apps are wiped on every reset.
      RUNNER_MAX_APPS_PER_USER: "32"
