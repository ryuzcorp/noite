# CI-only overlay for the Playwright e2e workflow
# (.github/workflows/e2e.yml; `make up-e2e`).
#
# The runner container cell is provisioned by celld at `celld deploy` time
# through an engine socket. The base file deliberately has no socket mount
# (a missing source breaks `make up` on rootless podman, which has no
# socket at the Docker path; see standalone.ts for the release
# equivalent) — this overlay adds it and points DOCKER_HOST at it.
services:
  control:
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Deploy runs from here (CWD): `celld deploy` re-bundles the worker
      # with esbuild, which resolves node_modules by walking up from the
      # working directory — the laptop flow (`celld deploy dist` from
      # apps/noite) works for the same reason. A bare `docker cp` of dist
      # has no modules above it and fails resolving @cloudflare/containers.
      - ../apps/noite:/e2e-app:ro
