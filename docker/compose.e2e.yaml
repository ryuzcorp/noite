# E2E lane (`make e2e`, docker/e2e-local.sh): its own project (`-p
# noite-e2e`) and bucket, raw ports for the Playwright helpers. The control
# UI is reached through Caddy (the lane sets HTTP_PORT=8090, so
# http://localhost:8090 serves it); the runner API and Git on :8080; tenant
# fleets on their own ports.
services:
  noite:
    ports:
      - "8080:8080"
      - "20000-20099:20000-20099"
    environment:
      NOITE_S3_BUCKET: noite-e2e
      BETTER_AUTH_URL: http://localhost:8090
      GIT_PUBLIC_BASE: http://localhost:8080/v1/git
      S3_PUBLIC_ENDPOINT: http://localhost:${RUSTFS_API_PORT:-19000}
      # No proxy in front of the lane: every request shares one client key.
      NOITE_RATE_LIMIT_RPM: "100000"
      NOITE_AUTH_RATE_LIMIT: "100000"
      NOITE_EDGE_RPM: "0"
      NOITE_EDGE_GIT_RPM: "0"
      # `E2E_TENANCY=multi` runs the isolation lane (hostile tenant spec).
      NOITE_TENANCY: ${E2E_TENANCY:-single}
