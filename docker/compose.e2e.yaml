# E2E overlay (`make e2e`, via docker/e2e-local.sh): raw localhost:ports, no
# Caddy, no subdomains. Same images and same services as prod minus the edge.
#
# Ports: runner API/git/health/ready on :8080, control UI on :8090, tenant
# fleets on their 81xx listen ports. Everything else (env, health gates) comes
# from docker/compose.yaml.
#
# State: this lane runs as its own compose project (-p noite-e2e), so the
# named volumes are `noite-e2e_*` — `down -v` in the lane can only ever remove
# those, never dev/prod storage. The fleet bucket is `noite-e2e` (dev/prod use
# `noite`), and wiping the rustfs volume wipes the bucket with it.
services:
  runner:
    ports:
      - "8080:8080"
      - "8100-8199:8100-8199"
    environment:
      # Raw-port git remote (no subdomains in this lane).
      GIT_PUBLIC_BASE: http://localhost:8080/v1/git
      NOITE_S3_BUCKET: noite-e2e
      S3_PUBLIC_ENDPOINT: http://localhost:9000

  control:
    ports:
      - "8090:8090"
    environment:
      BETTER_AUTH_URL: http://localhost:8090
      NOITE_S3_BUCKET: noite-e2e
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      # This lane has no proxy, so no client IP reaches the worker and every
      # request shares one bucket per route class. The suite drives the whole
      # UI from one address, so the production budgets would throttle it; the
      # limiter itself is exercised by hand (`NOITE_RATE_LIMIT_RPM=5`).
      NOITE_RATE_LIMIT_RPM: "100000"
      NOITE_AUTH_RATE_LIMIT: "100000"
