# documentation: https://noite.dev
# slogan: Tiny self-hostable PaaS for celld
# category: PaaS
# tags: paas,celld,git,edge,s3
# port: 80
# (No `# logo:` — this file deploys from our repo, not as an upstream
# Coolify service template.)
#
# Noite on Coolify — production Compose definition.
#
# HOW TO DEPLOY
#   1. Coolify → New Resource → Docker Compose (Git repository):
#        repository = your noite repo, branch = main,
#        Compose file = docker/compose.coolify.yaml, Base Directory = /.
#   2. Environment Variables tab: secrets auto-generate on first parse
#      (just save); BASE_DOMAIN is required and blocks deploy until set.
#      BETTER_AUTH_URL / GIT_PUBLIC_BASE derive from BASE_DOMAIN unless
#      overridden. Review ports, then Deploy.
#   3. Domains: two parts. `SERVICE_URL_CADDY_80` auto-provisions Coolify's
#      generated domain on `caddy:80` (boot check only); the runner adds that
#      hostname to the control site via CONTROL_EXTRA_HOSTS. Custom
#      hostnames CANNOT come from Compose — Coolify builds proxy labels
#      from the dashboard Domains field, so paste this once on the `caddy`
#      service (one entry per hostname, https, port 80, empty path):
#        https://app.BASE_DOMAIN:80,https://api.BASE_DOMAIN:80,https://git.BASE_DOMAIN:80
#      Tenant slugs are automatic: a dashboard-pasted file defines the
#      Traefik TCP router (see README for the verbatim snippet — static
#      text, since Coolify mangles `$` inside compose labels), forwarding
#      every `*.BASE_DOMAIN` SNI to our Caddy on `:443`, which mints
#      per-slug certs on demand (runner ask-gated; first visit pauses a few
#      seconds). One-time needs: `*.BASE_DOMAIN` DNS → the server, the
#      file saved, and the `traefik.tcp.services` label below intact
#      (check the `noite-tenants` router in the Traefik dashboard).
#      Do NOT point the apex at caddy — it stays on marketing/GitHub Pages.
#
# NOTES
#   - No `ports:` on caddy: published host ports bypass Coolify's proxy.
#     RustFS keeps its ports (console + S3 API) — reassign if they clash.
#   - No `container_name:`: Coolify manages container names itself.
#   - Secrets use Coolify-generated values (persisted across deploys); the
#     same variable referenced twice receives the same value.
#   - First boot takes a few minutes (Rust release build); runner waits for
#     RustFS readiness itself, so ordering needs no healthcheck gates.

name: noite

x-aws: &aws
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${SERVICE_USER_RUSTFS}
  AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_RUSTFS}
  AWS_EC2_METADATA_DISABLED: "true"

services:
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${SERVICE_USER_RUSTFS}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_64_RUSTFS}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      # Notify/webhook disabled: RustFS cannot send a bearer token, the runner
      # gate requires one — poll + deploy.sh nudge are the deploy triggers.
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks: [noite]

  runner:
    build:
      context: ./apps/runner
      dockerfile: Dockerfile
    image: noite-runner:coolify
    hostname: runner
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *aws
      RUNNER_BIND: "0.0.0.0:8080"
      RUNNER_TOKEN: ${SERVICE_PASSWORD_64_RUNNER}
      RUST_LOG: ${RUST_LOG:-noite_runner=info,tower_http=info}
      NOITE_DB: /data/noite.sqlite
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://rustfs:9000
      NOITE_S3_BUCKET: ${NOITE_S3_BUCKET:-noite}
      BASE_DOMAIN: ${BASE_DOMAIN:?}
      CONTROL_SUBDOMAIN: ${CONTROL_SUBDOMAIN:-app}
      CADDY_AUTO_HTTPS: "off"
      CADDYFILE_PATH: /caddy/Caddyfile
      CADDY_UPSTREAM_HOST: runner
      CADDY_CONTROL_UPSTREAM: ui:8080
      CADDY_API_UPSTREAM: runner:8080
      CONTROL_EXTRA_HOSTS: ${SERVICE_FQDN_CADDY_80}
      RUNNER_WORK_DIR: /data/runner
      PORT_BASE: "8100"
      RUNNER_POLL_MS: "5000"
      CELLD_BIN: celld
      GIT_PUBLIC_BASE: ${GIT_PUBLIC_BASE:-https://git.${BASE_DOMAIN}}
      UI_URL: ${UI_URL:-http://ui:8080}
    volumes:
      - agent-data:/data
      - caddy-config:/caddy
    networks: [noite]
    depends_on:
      - rustfs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  ui:
    # Immutable image: deps + vite build baked at `docker build` time.
    build:
      context: .
      dockerfile: docker/Dockerfile.control
    image: noite-control-ui:coolify
    hostname: ui
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      <<: *aws
      PORT: "8080"
      RUNNER_URL: http://runner:8080
      RUNNER_TOKEN: ${SERVICE_PASSWORD_64_RUNNER}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://app.${BASE_DOMAIN}}
      BASE_DOMAIN: ${BASE_DOMAIN:?}
      CONTROL_SUBDOMAIN: ${CONTROL_SUBDOMAIN:-app}
      NOITE_DB: /data/noite-control.sqlite
    volumes:
      - ui-data:/data
    networks: [noite]
    depends_on:
      - rustfs
      - runner
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  caddy:
    image: docker.io/library/caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      # Auto-provision Coolify's generated domain and route it to caddy:80.
      SERVICE_URL_CADDY_80: /
    labels:
      # Tenant TLS service definition only (a bare port — no `$`, which
      # Coolify rewrites to `$$` in labels so Docker never interpolates it
      # and Traefik receives a literal `${BASE_DOMAIN}` that matches
      # nothing). The TCP *router* lives in a dashboard-pasted file
      # instead (`Servers > server > Proxy > Dynamic Configurations`, see
      # README): file config is static text, and `noite-tenants@docker`
      # resolves this service live with no hardcoded address.
      - "traefik.enable=true"
      - "traefik.tcp.services.noite-tenants.loadbalancer.server.port=443"
    expose:
      - "80"
      - "443"
    volumes:
      - caddy-config:/etc/caddy
      - caddy-data:/data
    command:
      - /bin/sh
      - -c
      - |
        # Single owner for routes: the runner rewrites this file every reconcile
        # (5 s). Until its first write, serve a `:80` starting page so caddy
        # is healthy and routable from boot (an empty config listens on
        # nothing, which fails the healthcheck and yields "No Available
        # Server" at the proxy). Skipped when a real Caddyfile already exists.
        [ -f /etc/caddy/Caddyfile ] || printf '%s\n' ':80 {' '  respond "noite edge starting" 200' '}' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    networks: [noite]
    depends_on:
      - runner
      - ui
    healthcheck:
      test: ["CMD", "wget", "-q", "-O/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  noite:

volumes:
  rustfs-data:
  agent-data:
  ui-data:
  caddy-config:
  caddy-data:
