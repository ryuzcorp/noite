# BYOB: bring your own S3-compatible bucket instead of bundled RustFS.
#
#   S3_ENDPOINT=https://s3.us-east-1.amazonaws.com \
#   AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... \
#   NOITE_S3_BUCKET=noite S3_PUBLIC_ENDPOINT=https://s3.us-east-1.amazonaws.com \
#   docker compose -f docker/compose.yaml -f docker/compose.byob.yaml up -d
#
# Works with AWS S3, MinIO, R2, Ceph — anything SigV4. Both the runner and the
# control node talk to this endpoint; the bucket is created if the key allows
# it, otherwise create it first. Needs Get/Put/Delete/List on the bucket
# (ListAllMyBuckets optional: readiness falls back to HeadBucket).
services:
  rustfs:
    # Excluded from BYOB runs (the profile is never enabled). A dependency on a
    # service whose profile is not enabled fails validation ("depends on
    # undefined service"), so both consumers reset theirs to empty — there is no
    # bundled bucket to wait for.
    profiles: ["bundled-s3"]

  runner:
    depends_on: !reset []
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}

  control:
    depends_on: !reset []
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?}
      NOITE_S3_BUCKET: ${NOITE_S3_BUCKET:-noite}
