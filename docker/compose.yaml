# Noite stack: control celld fleet (with runner container cell) + RustFS + Caddy.
#
#   cp .env.example .env && make up && make logs
#
# Container migration cutover: the `runner` service is gone — the Rust runner
# runs as the `containers` cell of the control worker (`RunnerContainer` DO,
# image `Dockerfile.runner-container`, singleton standard-4). Worker dispatch
# follows RUNNER_TARGET=compose|container (container default).
#
# NOTE: host paths below are relative to this file's directory (docker/) —
# both `docker compose` (project dir defaults to the first -f file's dir)
# and podman-compose resolve them the same way. (The Coolify file is the
# exception: Coolify uses Base Directory as project dir, so its paths stay
# repo-root-relative.)

name: noite

x-aws: &aws
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-noiteaccess}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}
  AWS_EC2_METADATA_DISABLED: "true"

services:
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-noiteaccess}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      # Notify/webhook disabled: RustFS cannot send a bearer token, the runner
      # gate requires one, and the SPEC treats notify as unreliable — poll + the
      # deploy.sh nudge are the deploy triggers.
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks: [noite]
    # Gate control on S3 actually answering: on a fresh box rustfs spends
    # seconds initializing data dirs, and control's bucket validation
    # exits (non-zero, no restart on some platforms) if it dials too early.
    # Root GET / answers 403 without credentials — connection, not auth,
    # is the readiness signal, so no -f flag.
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  # Bucket note: the celld node validates s3://NOITE_S3_BUCKET at boot and
  # exits non-zero when missing — on a fresh box nothing else creates it
  # (the runner cell only starts after the worker serves). Control ensures
  # it in its own start command (idempotent head-or-make via the baked-in
  # awscli) instead of a separate init service, so no platform has to honor
  # cross-service completion ordering.
  control:
    # celld fleet node serving the control UI worker (`apps/noite/dist`
    # deployed via `celld deploy`) AND the runner container cell
    # (`RunnerContainer` DO → `Dockerfile.runner-container`). Reuses the
    # runner image — celld is baked in at /usr/local/bin/celld. Env mirrors
    # the runner's fleet spawn (apps/runner/src/host/supervisor.rs);
    # advertise stays loopback with published ports so host-side `celld d1` /
    # `diagnose` can dial the lease.
    # Built from the repo root (the Dockerfile COPYs apps/runner/…).
    # `make up` passes --build, so a source change always ships — no
    # separate build step to forget. Coolify: set NOITE_RUNNER_IMAGE to
    # the GHCR release tag to pull instead of building.
    build:
      context: ..
      dockerfile: Dockerfile.runner-container
    image: ${NOITE_RUNNER_IMAGE:-noite-runner:local}
    # Entrypoint script (baked in the image): ensures the fleet bucket,
    # then execs celld. Explicit here so GHCR (railpack `/bin/bash -c`
    # entrypoint) and local builds behave identically — never rely on
    # image defaults for control.
    entrypoint: ["/usr/local/bin/noite-entrypoint.sh"]
    hostname: control
    stop_grace_period: 15s
    # No `command:` — the entrypoint runs bucket-ensure + celld with
    # topology flags from env (explicit args would pass through verbatim).
    environment:
      <<: *aws
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      CELLD_WATCH: /data/control
      CELLD_DURABILITY: bucket
      CELLD_DEPLOY_POLL_S: "5"
      CELLD_TRUST_FORWARDED_HEADERS: "1"
      CELLD_OTEL: "1"
      CELLD_OTEL_FLUSH_MS: "2000"
      CELLD_OTEL_RETENTION: 14d
      # Container engine for the RunnerContainer cell (G1): the node starts
      # containers through this socket. Rootless podman likely cannot install
      # the celld fence (privileged nftables) — a rootful engine may be
      # required; see the migration plan gates.
      DOCKER_HOST: unix:///run/podman/podman.sock
      # Deploy-time vars source for the runner container cell: the worker
      # forwards its env into every container start (RunnerContainer envVars),
      # replacing the old compose `runner.environment:` block as a config
      # source. Secrets (RUNNER_TOKEN, AWS keys) arrive via wrangler secret /
      # deploy env in prod, `.dev.vars` never leaves the laptop.
      RUNNER_TARGET: ${RUNNER_TARGET:-container}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token}
      # Loopback S3 sidecar in the runner container (B1): the fence blocks
      # every route to this compose network, so the runner serves S3 to
      # itself on 127.0.0.1:9000 and the worker relays durability into R2.
      RUNNER_SIDECAR_S3: "1"
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      CONTROL_SUBDOMAIN: ${CONTROL_SUBDOMAIN:-}
      CONTROL_EXTRA_HOSTS: ${CONTROL_EXTRA_HOSTS:-}
      NOITE_S3_BUCKET: ${NOITE_S3_BUCKET:-noite}
      GIT_PUBLIC_BASE: ${GIT_PUBLIC_BASE:-http://git.localhost:${HTTP_PORT:-9080}}
      UI_URL: ${UI_URL:-http://control:8090}
      RUNNER_POLL_MS: "5000"
      PORT_BASE: "8100"
    networks: [noite]
    depends_on:
      rustfs:
        condition: service_healthy
    # Process-alive (not HTTP): an empty fleet accepts TCP on :8090 but
    # never answers without a deployment, so a curl gate would deadlock
    # fresh installs. PID 1 is celld (entrypoint reset); this only gates
    # ordering — caddy must not route before the node exists.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  caddy:
    # Baked edge image (Dockerfile.caddy + Caddyfile.static); `make up`
    # --build refreshes it on file edits, the standalone release pulls it.
    build:
      context: ..
      dockerfile: docker/Dockerfile.caddy
    image: noite-caddy:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
    expose:
      - "80"
      - "443"
    environment:
      # Coolify boot-check domain (ignored elsewhere).
      SERVICE_URL_CADDY_80: /
    labels:
      # Tenant TLS service for Coolify's Traefik (bare port — no `$`, which
      # Coolify rewrites in labels). The TCP *router* is a dashboard-pasted
      # file (`Servers > server > Proxy > Dynamic Configurations`):
      # `noite-tenants@docker` resolves this service live. Ignored without
      # Traefik — plain compose/docker setups are unaffected.
      - "traefik.enable=true"
      - "traefik.tcp.services.noite-tenants.loadbalancer.server.port=443"
    volumes:
      # Static edge: single wildcard site + on-demand TLS (ask via the
      # control worker) → reverse_proxy control:8090 for everything. See
      # docker/Caddyfile.static. `:z` relabels for container reads on
      # SELinux-enforcing hosts (Fedora); ignored elsewhere.
      - ./Caddyfile.static:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
    networks: [noite]
    # Wait for the node listener before routing to it (kills the 502 window
    # on fresh boot; an empty fleet still serves 404s, which is fine).
    depends_on:
      control:
        condition: service_healthy

networks:
  noite:

volumes:
  rustfs-data:
  control-state:
  caddy-data:
  bun-cache:
