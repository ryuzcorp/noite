# Noite stack: Rust runner + control celld fleet + RustFS + Caddy.
#
#   cp .env.example .env && make up && make logs
#
# Apex → Oxide (passkeys + actions). api.* → runner. <slug> → tenant fleets.
#
# NOTE: host paths below are relative to this file's directory (docker/) —
# both `docker compose` (project dir defaults to the first -f file's dir)
# and podman-compose resolve them the same way. (The Coolify file is the
# exception: Coolify uses Base Directory as project dir, so its paths stay
# repo-root-relative.)

name: noite

x-aws: &aws
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-noiteaccess}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}
  AWS_EC2_METADATA_DISABLED: "true"

services:
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-noiteaccess}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      # Notify/webhook disabled: RustFS cannot send a bearer token, the runner
      # gate requires one, and the SPEC treats notify as unreliable — poll + the
      # deploy.sh nudge are the deploy triggers.
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks: [noite]

  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    image: noite-runner:local
    container_name: noite-runner
    hostname: runner
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *aws
      RUNNER_BIND: "0.0.0.0:8080"
      # RUNNER_TOKEN preferred; HOST_TOKEN / AGENT_TOKEN still accepted by the binary.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-${HOST_TOKEN:-${AGENT_TOKEN:-dev-runner-token}}}
      NOITE_DB: /data/noite.sqlite
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${RUSTFS_API_PORT:-9000}
      NOITE_S3_BUCKET: ${NOITE_S3_BUCKET:-noite}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      # Empty = control on bare domain (dev); prod sets CONTROL_SUBDOMAIN=app.
      CONTROL_SUBDOMAIN: ${CONTROL_SUBDOMAIN:-}
      # Extra hostnames serving the control UI (e.g. `make dev-host` LAN IP).
      CONTROL_EXTRA_HOSTS: ${CONTROL_EXTRA_HOSTS:-}
      CADDYFILE_PATH: /caddy/Caddyfile
      CADDY_UPSTREAM_HOST: runner
      CADDY_CONTROL_UPSTREAM: control:8090
      CADDY_API_UPSTREAM: runner:8080
      RUNNER_WORK_DIR: /data/runner
      PORT_BASE: "8100"
      RUNNER_POLL_MS: "5000"
      CELLD_BIN: celld
      GIT_PUBLIC_BASE: ${GIT_PUBLIC_BASE:-http://git.localhost:${HTTP_PORT:-9080}}
      UI_URL: ${UI_URL:-http://control:8090}
    volumes:
      # Volume key kept as agent-data so existing stacks keep SQLite / builds.
      - agent-data:/data
      - caddy-config:/caddy
    networks: [noite]
    depends_on:
      - rustfs

  control:
    # celld fleet node serving the control UI worker (`apps/noite/dist`
    # deployed via `celld deploy`). Reuses the runner image — celld is baked
    # in at /usr/local/bin/celld. Env mirrors the runner's fleet spawn
    # (apps/runner/src/host/supervisor.rs); advertise stays loopback with
    # published ports so host-side `celld d1` / `diagnose` can dial the lease.
    image: noite-runner:local
    container_name: noite-control
    hostname: control
    restart: unless-stopped
    stop_grace_period: 15s
    command:
      - celld
      - --bucket
      - s3://${NOITE_S3_BUCKET:-noite}/control
      - --endpoint
      - ${S3_ENDPOINT:-http://rustfs:9000}
      - --region
      - ${AWS_REGION:-us-east-1}
      - --listen
      - 0.0.0.0:8090
      - --internal-listen
      - 0.0.0.0:8091
      - --advertise
      - 127.0.0.1:8091
    environment:
      <<: *aws
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      CELLD_WATCH: /data/control
      CELLD_DURABILITY: bucket
      CELLD_DEPLOY_POLL_S: "5"
      CELLD_TRUST_FORWARDED_HEADERS: "1"
      CELLD_OTEL: "1"
      CELLD_OTEL_FLUSH_MS: "2000"
      CELLD_OTEL_RETENTION: 14d
    ports:
      - "8090:8090"
      - "8091:8091"
    volumes:
      - control-state:/data
    networks: [noite]
    depends_on:
      - rustfs

  caddy:
    image: docker.io/library/caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
    volumes:
      - caddy-config:/etc/caddy
      - caddy-data:/data
    command:
      - /bin/sh
      - -c
      - |
        # Single owner for routes: the runner rewrites this file every reconcile
        # (5 s). Until its first write, serve a `:80` starting page so caddy
        # listens from boot (an empty config listens on nothing, which reads
        # as down until routes appear). Skipped when a Caddyfile already exists.
        [ -f /etc/caddy/Caddyfile ] || printf '%s\n' ':80 {' '  respond "noite edge starting" 200' '}' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    networks: [noite]
    depends_on:
      - runner
      - control

networks:
  noite:

volumes:
  rustfs-data:
  agent-data:
  control-state:
  caddy-config:
  caddy-data:
  bun-cache:
