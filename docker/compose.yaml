# Noite: the whole install (SPEC, Install targets). One `noite` service (the
# runner, Caddy, the control UI and every tenant fleet in one container) and
# the bundled RustFS store.
#
#   make up-prod                           pull the release image
#   make up                                build it from this tree
#   docker compose -f docker/compose.yaml up -d
#                                          same file on a host with no clone
#
# Every variable has a default, so this file renders and boots with no `.env`
# (Compose stores, cloud VMs). Real domains need real secrets: the runner
# refuses dev defaults off localhost.
#
# Bring your own S3 (R2, Tigris, S3 — celld-qualified stores): set
# S3_ENDPOINT, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and start without the
# bundled store: `docker compose -f docker/compose.yaml up -d --scale rustfs=0`.
name: noite

services:
  noite:
    image: ${NOITE_IMAGE:-ghcr.io/ryuzcorp/noite:latest}
    restart: unless-stopped
    # Above the runner's stop budget (NOITE_STOP_BUDGET_MS, 25 s): it stops
    # every fleet, then Caddy, then writes the final state snapshot.
    stop_grace_period: 35s
    # Tenant isolation (SPEC): dropping to the build/fleet users, handing
    # worktrees over, and the nft egress policy. Without them the runner
    # serves single-tenant only (NOITE_TENANCY=multi refuses to start builds).
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN]
    environment:
      RUST_LOG: ${RUST_LOG:-noite_runner=info,tower_http=info}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      # Empty = control on the bare domain (dev `localhost`); prod sets `app`.
      CONTROL_SUBDOMAIN: ${CONTROL_SUBDOMAIN:-}
      CONTROL_EXTRA_HOSTS: ${CONTROL_EXTRA_HOSTS:-}
      # Unset = on except localhost; `off` behind a terminating proxy.
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-}
      HTTP_PORT: ${HTTP_PORT:-9080}
      GIT_PUBLIC_BASE: ${GIT_PUBLIC_BASE:-http://git.localhost:${HTTP_PORT:-9080}}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token}
      # Object store (bundled RustFS by default).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      NOITE_S3_BUCKET: ${NOITE_S3_BUCKET:-noite}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY:-noiteaccess}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}}
      AWS_EC2_METADATA_DISABLED: "true"
      # Control UI (passed to the worker by the runner). Passkeys bind to
      # BETTER_AUTH_URL: set it before anyone registers.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${HTTP_PORT:-9080}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me-to-a-long-random-string}
      NOITE_ADMIN_EMAIL: ${NOITE_ADMIN_EMAIL:-}
      NOITE_EMAIL_WEBHOOK_URL: ${NOITE_EMAIL_WEBHOOK_URL:-}
      NOITE_SMTP_FROM: ${NOITE_SMTP_FROM:-}
      NOITE_RATE_LIMIT_RPM: ${NOITE_RATE_LIMIT_RPM:-600}
      NOITE_AUTH_RATE_LIMIT: ${NOITE_AUTH_RATE_LIMIT:-600}
      # Tenancy and bounds (see .env.example).
      NOITE_TENANCY: ${NOITE_TENANCY:-}
      NOITE_STOP_BUDGET_MS: ${NOITE_STOP_BUDGET_MS:-25000}
      RUNNER_MAX_APPS_PER_USER: ${RUNNER_MAX_APPS_PER_USER:-10}
      RUNNER_FLEET_MAX_RSS_MB: ${RUNNER_FLEET_MAX_RSS_MB:-0}
      RUNNER_FLEET_IDLE_EVICT_S: ${RUNNER_FLEET_IDLE_EVICT_S:-120}
      RUNNER_FLEET_LOG: ${RUNNER_FLEET_LOG:-error,celld=warn}
      RUNNER_BUILD_MAX_MB: ${RUNNER_BUILD_MAX_MB:-2048}
      # Resource knobs (SPEC, Limits / Observability; resource-optimization-spec.md).
      RUNNER_BUILD_CACHE_MB: ${RUNNER_BUILD_CACHE_MB:-512}
      RUNNER_FLEET_ASSET_CACHE_MB: ${RUNNER_FLEET_ASSET_CACHE_MB:-64}
      RUNNER_FLEET_DEPLOY_POLL_S: ${RUNNER_FLEET_DEPLOY_POLL_S:-300}
      RUNNER_OTEL_FLUSH_MS: ${RUNNER_OTEL_FLUSH_MS:-30000}
      RUNNER_TELEMETRY_RETENTION_DAYS: ${RUNNER_TELEMETRY_RETENTION_DAYS:-30}
      RUNNER_TIP_SWEEP_S: ${RUNNER_TIP_SWEEP_S:-60}
      # Scale to zero (SPEC): park apps idle this many hours (0 = never);
      # the next request wakes them transparently.
      RUNNER_SLEEP_AFTER_H: ${RUNNER_SLEEP_AFTER_H:-24}
      RUNNER_SLEEP_SWEEP_S: ${RUNNER_SLEEP_SWEEP_S:-3600}
      RUNNER_WAKE_TIMEOUT_S: ${RUNNER_WAKE_TIMEOUT_S:-120}
      # Coolify boot-check domain (ignored elsewhere).
      SERVICE_URL_NOITE_80: /
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
    volumes:
      # Runner SQLite (also snapshotted to the bucket), git mirrors, builds,
      # fleet working dirs, Caddy config + certificates.
      - noite-data:/data
    networks: [noite]
    labels:
      # Tenant TLS service for Coolify's Traefik (bare port: Coolify rewrites
      # `$` in labels). The TCP router is a dashboard-pasted file; see
      # apps/website/docs/deployment.mdx. Ignored without Traefik.
      - "traefik.enable=true"
      - "traefik.tcp.services.noite-tenants.loadbalancer.server.port=443"
    depends_on:
      rustfs:
        condition: service_healthy
        # BYO S3: `--scale rustfs=0` leaves nothing to wait for.
        required: false
    healthcheck:
      # 200 only when reconcile ran, the bucket answers, isolation holds (in
      # multi), the control fleet is healthy and Caddy took its config; the
      # body names what is failing.
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-noiteaccess}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    # Loopback only: the S3 API is for this host's tools (doctor, backups),
    # not the network.
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
    networks: [noite]
    # Root GET / answers 403 without credentials: connection, not auth, is
    # the readiness signal.
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  noite:

volumes:
  noite-data:
  rustfs-data:
