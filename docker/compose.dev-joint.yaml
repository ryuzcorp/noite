# Dev-joint stack: prod joint topology (runner :8080 + UI :8081 in one
# container, /data/{runner,ui}.sqlite) with dev processes — cargo-watch +
# Vite HMR via docker/noite-joint-dev.sh. Joint-only wiring breaks here,
# not in prod.
#
#   make dev-joint
#
# UI code, runner code, and the entrypoint are all bind-mounted: no image
# rebuild on change (use make dev-build only when Dockerfiles change).
name: noite

services:
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-noiteaccess}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks: [noite]

  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner-dev
    image: noite-runner-dev:local
    hostname: control
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-noiteaccess}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-noitesecretnoitesecretnoite12}
      AWS_EC2_METADATA_DISABLED: "true"
      RUNNER_BIND: "0.0.0.0:8080"
      RUNNER_TOKEN: ${RUNNER_TOKEN:-${HOST_TOKEN:-${AGENT_TOKEN:-dev-runner-token}}}
      RUNNER_URL: http://127.0.0.1:8080
      UI_URL: ${UI_URL:-http://127.0.0.1:8081}
      RUST_LOG: ${RUST_LOG:-noite_runner=debug,tower_http=info}
      NOITE_RUNNER_DB: /data/runner.sqlite
      NOITE_UI_DB: /data/ui.sqlite
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${RUSTFS_API_PORT:-9000}
      NOITE_S3_BUCKET: ${NOITE_S3_BUCKET:-noite}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      CONTROL_SUBDOMAIN: ${CONTROL_SUBDOMAIN:-}
      CADDY_AUTO_HTTPS: "off"
      CADDYFILE_PATH: /caddy/Caddyfile
      CADDY_UPSTREAM_HOST: control
      CADDY_CONTROL_UPSTREAM: control:8081
      CADDY_API_UPSTREAM: control:8080
      RUNNER_WORK_DIR: /data/runner
      PORT_BASE: "8100"
      RUNNER_POLL_MS: "5000"
      CELLD_BIN: celld
      GIT_PUBLIC_BASE: ${GIT_PUBLIC_BASE:-http://git.localhost:${HTTP_PORT:-9080}}
      PORT: "8081"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me-to-a-long-random-string}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${HTTP_PORT:-9080}}
      NOITE_ADMIN_EMAIL: ${NOITE_ADMIN_EMAIL:-}
      # 1 = release-mode runner (perf bugs), polling Vite watcher (flaky
      # rootless inotify — HMR blindness becomes a toggle, not a mystery).
      RUNNER_DEV_RELEASE: ${RUNNER_DEV_RELEASE:-0}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-0}
      CARGO_TERM_COLOR: always
    volumes:
      - ../apps/runner:/src
      - ../apps/noite:/app
      - ../docker/noite-joint-dev.sh:/noite-joint-dev.sh:ro
      - runner-cargo-registry:/usr/local/cargo/registry
      - runner-cargo-git:/usr/local/cargo/git
      - runner-target:/src/target
      - dev-control-data:/data
      - caddy-config:/caddy
      - bun-cache:/root/.bun/install/cache
    networks: [noite]
    depends_on:
      - rustfs
    command: ["/bin/sh", "/noite-joint-dev.sh"]

  caddy:
    image: docker.io/library/caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
    volumes:
      - caddy-config:/etc/caddy
      - caddy-data:/data
    command:
      - /bin/sh
      - -c
      - |
        [ -f /etc/caddy/Caddyfile ] || printf '%s\n' ':80 {' '  respond "noite edge starting" 200' '}' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    networks: [noite]
    depends_on:
      - control

networks:
  noite:

volumes:
  rustfs-data:
  runner-cargo-registry:
  runner-cargo-git:
  runner-target:
  dev-control-data:
  caddy-config:
  caddy-data:
  bun-cache:
