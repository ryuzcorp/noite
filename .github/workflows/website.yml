# Marketing site + docs (apps/website, Blume) → GitHub Pages.
#
# After the first run: repo Settings → Pages → Custom domain = noite.now
# (plus the DNS A/AAAA records), then re-run to stamp the CNAME.
#
# A pull request that touches the site builds it too, and stops at the build:
# the site's own build is the only thing that validates MDX, so without this a
# broken page is only found on main, after merge (#342's create.mdx stayed red
# for a week). `deploy` below is skipped for every non-push event, so a PR run
# never holds the Pages environment, its token or its OIDC identity — it runs
# with the build job's `contents: read` only.
name: website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

# One build/deploy at a time per ref: a pull request's build must not cancel an
# in-flight main deploy, and each PR gets its own group (its own `ref`).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # ~3x the 0.8 min p95 (50 runs, 2026-11-11), floor 10.
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 3
      - name: cache bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/noite/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
          path: ~/.bun/install/cache
      # The job's default working directory is apps/website, so the wrapper
      # installs there with no `--cwd` (the script path stays absolute).
      - name: install website deps
        timeout-minutes: 5
        run: sh "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"
      - run: bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/website/dist

  deploy:
    needs: build
    # Publish from a push to main (and a manual run), never from a pull
    # request: the Pages environment, `pages: write` and the OIDC token stay
    # on trusted refs. A PR run ends green at `build`.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # ~3x the 1.7 min p95 (50 runs, 2026-11-11), floor 10.
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
