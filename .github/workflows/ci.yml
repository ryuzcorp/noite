# Pull-request gate: lint, formatting, version-pin drift, every compose variant
# renders, the Rust crate builds warning-free with its tests, and the worker
# bundle builds for celld. Release images are a separate workflow (`images.yml`).
#
# The end-to-end lanes (`make e2e`, `make e2e-isolation`) need a container
# engine plus a few minutes, so they are not a pull-request job: run them from
# the Actions tab (`workflow_dispatch`) or locally. They are the release gate
# too: `images.yml` runs them on every `v*` tag before pushing an image.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - name: lint and format
        run: bun run check
      - name: version pins
        run: bun docker/check-versions.ts
      # `config` needs no daemon, so a broken compose file fails here instead of
      # on someone's server. Every variant, including the test overlays.
      - name: render compose (prod, build, dev, e2e)
        run: |
          docker compose -f docker/compose.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.build.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.dev.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.e2e.yaml config > /dev/null
      # Parse each script with its shebang's shell: `sh` is dash here, and
      # install.sh/uninstall.sh are bash.
      - name: shell scripts parse
        run: |
          for f in docker/*.sh; do
            case "$(head -n1 "$f")" in
            *bash*) bash -n "$f" ;;
            *) sh -n "$f" ;;
            esac
          done
      - name: runner schema applies twice (idempotent)
        run: |
          sqlite3 /tmp/schema.db < apps/runner/schema.sql
          sqlite3 /tmp/schema.db < apps/runner/schema.sql
          for t in app app_credential app_env app_metric deploy metric_watermark; do
            sqlite3 /tmp/schema.db "SELECT name FROM sqlite_master WHERE type='table' AND name='$t'" | grep -qx "$t"
          done

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The Rust workspace lives at apps/runner, not the repo root.
          workspaces: apps/runner
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The UI image installs from apps/noite's own lockfile, so CI must too —
      # a drift there breaks the image build, not this build.
      - name: install UI deps
        working-directory: apps/noite
        run: bun install --frozen-lockfile
      # Build first: the ilha Vite plugin writes `.ilha/pages.d.ts` (the
      # `ilha:pages/*` types, gitignored), and tsc cannot resolve them without it.
      - name: build worker bundle
        working-directory: apps/noite
        run: bun run build
      - name: typecheck
        working-directory: apps/noite
        run: bunx tsc --noEmit

  # Manual, because it builds the image and drives a real browser. The lanes
  # live in e2e.yml, which `images.yml` also runs as the release gate.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e.yml
