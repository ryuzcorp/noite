# Pull-request gate: the shared checks below (`check.yml`: lint, formatting,
# version-pin drift, every compose variant, script parsing, schema idempotency,
# the CLI bundle), the Rust crate warning-free with its tests, and the worker
# bundle for celld. Release images are a separate workflow (`images.yml`).
#
# The end-to-end lanes (`make e2e`, `make e2e-isolation`) need a container
# engine plus a few minutes, so they are not a pull-request job: run them from
# the Actions tab (`workflow_dispatch`) or locally. They are the release gate
# too: `images.yml` runs them on every `v*` tag before pushing an image.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The Rust workspace lives at apps/runner, not the repo root.
          workspaces: apps/runner
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The UI image installs from apps/noite's own lockfile, so CI must too —
      # a drift there breaks the image build, not this build.
      - name: install UI deps
        working-directory: apps/noite
        run: bun install --frozen-lockfile
      # Build first: the ilha Vite plugin writes `.ilha/pages.d.ts` (the
      # `ilha:pages/*` types, gitignored), and tsc cannot resolve them without it.
      - name: build worker bundle
        working-directory: apps/noite
        run: bun run build
      - name: typecheck
        working-directory: apps/noite
        run: bunx tsc --noEmit

  # Manual, because it builds the image and drives a real browser. The lanes
  # live in e2e.yml, which `images.yml` also runs as the release gate.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e.yml
