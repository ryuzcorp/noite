# Pull-request gate: the shared checks below (`check.yml`: lint, formatting,
# version-pin drift, every compose variant, script parsing, schema idempotency,
# the CLI bundle), the Rust crate warning-free with its tests, the worker
# bundle for celld, and a build of the release image (pushed nowhere).
# Release images are a separate workflow (`images.yml`).
#
# The end-to-end lanes (`make e2e`, `make e2e-isolation`) need a container
# engine plus a few minutes, so they are not on the default path: they run on
# pull requests carrying the `e2e` label, from the Actions tab
# (`workflow_dispatch`), or locally. They are the release gate too:
# `images.yml` runs them on every `v*` tag before pushing an image.
name: ci

on:
  pull_request:
    # `labeled`: adding the `e2e` label must re-run the gate so the lane
    # below sees it without another push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The Rust workspace lives at apps/runner, not the repo root.
          workspaces: apps/runner
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The UI image installs from apps/noite's own lockfile, so CI must too —
      # a drift there breaks the image build, not this build.
      - name: install UI deps
        working-directory: apps/noite
        run: bun install --frozen-lockfile
      # Build first: the ilha Vite plugin writes `.ilha/pages.d.ts` (the
      # `ilha:pages/*` types, gitignored), and tsc cannot resolve them without it.
      - name: build worker bundle
        working-directory: apps/noite
        run: bun run build
      - name: typecheck
        working-directory: apps/noite
        run: bunx tsc --noEmit

  # The release image, built but never pushed: the UI stage installs from
  # apps/noite's standalone lockfile and `bun run build`s inside docker, which
  # neither the worker job above (workspace-root install) nor any other PR job
  # replicates — every past image-only breakage (trustedDependencies,
  # .assetsignore handling, SSR snapshot atoms) was green here. Single
  # platform plus the shared GHA cache (same scope as the release build, so
  # main's layers warm the PR build) keeps it incremental.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: noite
          push: false
          cache-from: type=gha,scope=noite-linux/amd64
          cache-to: type=gha,mode=max,scope=noite-linux/amd64

  # Opt-in per pull request: add the `e2e` label, or run by hand from the
  # Actions tab. The lanes live in e2e.yml, which `images.yml` also runs as
  # the release gate.
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/e2e.yml
