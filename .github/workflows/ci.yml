# Pull-request gate: the shared checks below (`check.yml`: lint, formatting,
# version-pin drift, every compose variant, script parsing, schema idempotency,
# the CLI bundle), the Rust crate warning-free with its tests, the worker
# bundle for celld, and a build of the release image (pushed nowhere).
# Release images are a separate workflow (`images.yml`).
#
# The end-to-end lanes (`make e2e`, `make e2e-isolation`) need a container
# engine plus a few minutes, so the pull-request default is the fast suite:
# PRs that touch runtime code run the tagged gate automatically, and the
# `e2e` label upgrades the run to the release suite (every spec). Dispatch
# from the Actions tab runs the chosen suite. They are the release gate too:
# `images.yml` runs the release suite on every `v*` tag before pushing an
# image.
#
# Labels never start this workflow: `pull_request` has no `labeled`/`unlabeled`
# trigger on purpose. A label change (security labels, `e2e`) neither starts
# CI jobs nor cancels the running gate, and a PR opened already carrying
# `e2e` is a single run. Adding `e2e` to an open PR takes effect on the next
# push (or close/reopen, or a manual dispatch): push an empty commit if the
# branch is otherwise done.
name: ci

on:
  pull_request:
    # No `labeled`/`unlabeled`: see above. Reopened still re-runs the gate.
    types: [opened, synchronize, reopened]
  # The merge queue runs every job on the merged result, never skipped by
  # paths, with the release suite on both lanes.
  merge_group:
  workflow_dispatch:
    inputs:
      suite:
        default: release
        description: Which e2e spec set to run (fast = the tagged PR gate, release = every spec).
        options: [release, fast]
        required: false
        type: choice

permissions:
  contents: read

concurrency:
  # One in-flight run per PR ref (a push cancels the superseded run). Each
  # merge-queue entry gets its own group from its head SHA, so queued entries
  # never cancel each other or a PR's run.
  group: ci-${{ github.event_name == 'merge_group' && github.sha || github.ref }}
  # Merge-queue entries must run to completion; PR pushes cancel in progress.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The scoped-credential integration test mints and enforces real keys
    # against this store (SPEC, Scoped credentials); the pin matches the
    # bundled image the item verified.
    services:
      rustfs:
        image: docker.io/rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: noiteaccess
          RUSTFS_SECRET_KEY: noitesecretnoitesecretnoite12
        ports:
          - 9000:9000
    env:
      NOITE_TEST_RUSTFS_ENDPOINT: http://localhost:9000
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The Rust workspace lives at apps/runner, not the repo root.
          workspaces: apps/runner
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The UI image installs from apps/noite's own lockfile, so CI must too —
      # a drift there breaks the image build, not this build.
      - name: install UI deps
        working-directory: apps/noite
        run: bun install --frozen-lockfile
      # Build first: the ilha Vite plugin writes `.ilha/pages.d.ts` (the
      # `ilha:pages/*` types, gitignored), and tsc cannot resolve them without it.
      - name: build worker bundle
        working-directory: apps/noite
        run: bun run build
      - name: typecheck
        working-directory: apps/noite
        run: bunx tsc --noEmit

  # The release image, built but never pushed: the UI stage installs from
  # apps/noite's standalone lockfile and `bun run build`s inside docker, which
  # neither the worker job above (workspace-root install) nor any other PR job
  # replicates — every past image-only breakage (trustedDependencies,
  # .assetsignore handling, SSR snapshot atoms) was green here. Single
  # platform plus the shared GHA cache (same scope as the release build, so
  # main's layers warm the PR build) keeps it incremental.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: noite
          push: false
          cache-from: type=gha,scope=noite-linux/amd64
          cache-to: type=gha,mode=max,scope=noite-linux/amd64

  # Which runtime-code filter decides the automatic fast run. The `e2e` label
  # upgrades a pull request to the release suite; docs-only PRs run no lane.
  # PR-only: the merge queue runs everything with no paths-filter skip.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # apps/website is the docs site, outside the runtime.
          filters: |
            code:
              - 'apps/noite/**'
              - 'apps/runner/**'
              - 'packages/**'
              - 'docker/**'
              - 'Makefile'
              - 'bun.lock'
              - '.env.example'
              - '.github/workflows/e2e.yml'

  # Fast on code pull requests, release on the `e2e` label or by hand from the
  # Actions tab, always release on merge_group. The lanes live in e2e.yml,
  # which `images.yml` also runs as the release gate.
  e2e:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'e2e') || needs.changes.outputs.code == 'true')
    uses: ./.github/workflows/e2e.yml
    with:
      suite: ${{ (github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'e2e')) && 'release' || inputs.suite || 'fast' }}

  # The merge-queue gate (required check, with `security-gate`): fails if any
  # needed job failed or was cancelled. `skipped` is accepted only where the
  # paths-filter legitimately skips: docs-only PRs run no lane, and the
  # `changes` job itself runs on `pull_request` only. On `merge_group` and
  # `workflow_dispatch` the e2e lanes must be `success`.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, rust, worker, image, changes, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: aggregate job results
        run: |
          check_result="${{ needs.check.result }}"
          rust_result="${{ needs.rust.result }}"
          worker_result="${{ needs.worker.result }}"
          image_result="${{ needs.image.result }}"
          changes_result="${{ needs.changes.result }}"
          e2e_result="${{ needs.e2e.result }}"
          event_name="${{ github.event_name }}"
          fail=0
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 must be success, was $2"
              fail=1
            fi
          }
          require_success check "$check_result"
          require_success rust "$rust_result"
          require_success worker "$worker_result"
          require_success image "$image_result"
          # The paths-filter job runs on pull_request only; elsewhere it is
          # legitimately skipped.
          case "$changes_result" in
            success|skipped) ;;
            *) echo "::error::changes must be success or skipped, was $changes_result"; fail=1 ;;
          esac
          # The queue and manual runs must run the lanes. On a PR, `skipped`
          # is accepted only when the paths-filter found no runtime code and
          # the PR carries no `e2e` label: exactly when the e2e job's own
          # condition is false, so a lane skipped for any other reason fails.
          lane_expected="${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' || contains(github.event.pull_request.labels.*.name, 'e2e') }}"
          if [ "$lane_expected" = "true" ]; then
            require_success e2e "$e2e_result"
          else
            case "$e2e_result" in
              success|skipped) ;;
              *) echo "::error::e2e must be success or skipped, was $e2e_result"; fail=1 ;;
            esac
          fi
          {
            echo "## ci-ok: per-job results (${event_name})"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| check | ${check_result} |"
            echo "| rust | ${rust_result} |"
            echo "| worker | ${worker_result} |"
            echo "| image | ${image_result} |"
            echo "| changes | ${changes_result} |"
            echo "| e2e | ${e2e_result} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "ci-ok: every needed job met its requirement."
