# Weekly drift detector for the image pins.
#
# Official images re-push the same tag for a base-OS update: `rust:1-bookworm`
# and `bun:1.4` are floating, and even `node:24.22.3-slim` is rebuilt. A
# tag->digest equality check is therefore not a deterministic pull-request
# gate — it failed unrelated PRs when rust rebuilt on 2026-11-12. `check.yml`
# resolves image digests only for a PR that changes a pin; the immutable
# tarball/registry pins (Node SHASUMS256, npm integrity, release assets) still
# gate every PR. This run does the full online leg and files the drift as an
# issue, so it is noticed instead of blocking someone else's merge.
#
# `docker/check-versions.ts --online-images` prints one `now resolves to`
# line per moved tag; the fix is to take the new digest deliberately
# (AGENTS.md, "Updating a pin") and rebuild both platforms.
name: pin-drift

on:
  schedule:
    # Mondays 05:17 UTC, after the weekend rebuilds and off the hour (GitHub
    # delays runs scheduled on `:00`).
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    # ~3x the 0.7 min p95 of the online leg (50 check runs, 2026-11-11),
    # floor 10.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 3
      - run: bun install
        timeout-minutes: 5
      # `continue-on-error` so the issue below is filed before the job turns
      # red; the last step fails the run either way.
      - name: every image tag and tarball pin, against its publisher
        id: online
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bun docker/check-versions.ts --online --online-images 2>&1 | tee /tmp/pin-drift.log
      - name: open or update the "Image pin drift" issue
        if: steps.online.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly pin check found at least one pin that no longer matches"
            echo "what its publisher serves (run: $RUN_URL)."
            echo ""
            echo "An image tag moved upstream. Take the new digest deliberately in"
            echo "\`docker/Dockerfile\` (keep the tag next to it), then rebuild both"
            echo "platforms — see AGENTS.md, \"Updating a pin\". A tarball checksum that"
            echo "changed is not drift: it means the version was bumped without its"
            echo "checksum, and that fails every PR until it is fixed."
            echo ""
            echo "<details><summary>check output</summary>"
            echo ""
            echo '```'
            tail -n 80 /tmp/pin-drift.log
            echo '```'
            echo ""
            echo "</details>"
          } > /tmp/pin-drift-issue.md
          number=$(gh issue list --state open --search '"Image pin drift" in:title' --json number,title --jq 'map(select(.title == "Image pin drift"))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/pin-drift-issue.md
          else
            gh issue create --title "Image pin drift" --body-file /tmp/pin-drift-issue.md
          fi
      - name: close the issue once every pin matches again
        if: steps.online.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search '"Image pin drift" in:title' --json number,title --jq 'map(select(.title == "Image pin drift"))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Every pin matches its publisher again ($RUN_URL)."
          fi
      - name: fail the run so drift is visible in Actions
        if: steps.online.outcome == 'failure'
        run: exit 1
