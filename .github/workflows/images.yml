# Production control image for the Coolify Compose stack (ghcr.io).
#
# One joint image — Rust runner + Bun control UI — defined declaratively in
# railpack.json and built through the Railpack BuildKit frontend, so plain
# buildx handles push/cache/multi-arch. Coolify does NOT rolling-update
# Compose apps, so prod never builds: this workflow bakes the immutable
# image per commit, and docker/compose.coolify.yaml pulls it by tag.
# A control-image change restarts runner+UI together (fleets cold-boot),
# so batch control changes and pin NOITE_RELEASE to a SHA/tag.
#
# The Railpack frontend builds ONE platform per invocation, so each arch
# builds natively in matrix (amd64 + arm64 runners — no QEMU) and pushes
# by digest; the merge job assembles the multi-arch manifest list.
#
# Tags: `latest` + short SHA on main; version tags (v*) also push `stable`.
# In Coolify, pin NOITE_RELEASE for reproducible deploys, or leave it
# `latest` to follow main (pull_policy: always re-pulls).
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/runner/**"
      - "apps/noite/**"
      - "docker/noite-joint.sh"
      - "railpack.json"
      - ".github/workflows/images.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pinned Railpack CLI: generates railpack-plan.json for the BuildKit
      # frontend (the frontend cannot read railpack.json itself).
      - run: |
          curl -sSL https://railpack.com/install.sh -o /tmp/railpack-install.sh
          RAILPACK_VERSION=0.39.0 sh /tmp/railpack-install.sh --bin-dir "$HOME/.local/bin"
          "$HOME/.local/bin/railpack" prepare --plan-out railpack-plan.json .
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: railpack-plan.json
          build-args: BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend:v0.0.32
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/noite,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          echo -n "$DIGEST" > "/tmp/digests/$SUFFIX"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Bare sha256 per platform — no credentials, no code.
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/noite
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
      - run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=""
          for f in /tmp/digests/*; do
            digests="$digests $IMAGE@$(cat "$f")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/noite
