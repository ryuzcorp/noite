# Release image for ghcr.io: `ghcr.io/<owner>/noite`, the whole install in one
# container (docker/Dockerfile, target `noite`). Built with buildx, one
# platform per native runner, pushed by digest, then merged into a multi-arch
# manifest list.
#
# Installs never build in prod: they pull a channel tag (NOITE_IMAGE) and
# `docker compose up -d`. A new image restarts the runner and with it every
# tenant fleet (they cold-boot), so installs follow RELEASES, not main.
#
# Tags:
#   main push        `edge` + short SHA (CI and rollbacks; not an install target)
#   v* tag           the version (`0.1.0-alpha.1`) and short SHA, then a GitHub
#                    PRE-release with that version's CHANGELOG notes. No channel
#                    moves: try it with `run.sh | bash -s install --pre`.
#   release marked   `promote.yml` points `alpha` (and, for a final version, no
#   as a release     `-` in it, `stable`) at that version's image. No rebuild.
#
# A release tag is a gate, not a trigger: the e2e lanes (`make e2e`,
# `make e2e-isolation`) and the CHANGELOG check must pass before anything is
# pushed to GHCR.
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/runner/**"
      - "apps/noite/**"
      - "docker/Dockerfile"
      - "docker/Dockerfile.dockerignore"
      - "docker/install-sidecars.sh"
      - "docker/compose.yaml"
      - ".github/workflows/images.yml"
      - ".github/workflows/check.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared with `ci.yml` (`check.yml`); a release tag also needs its CHANGELOG
  # entry. The `e2e` and `image` jobs below gate on this one.
  check:
    uses: ./.github/workflows/check.yml
    with:
      changelog: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Release tags only: the same lanes the Actions tab runs by hand, as a gate.
  # The image below is built from the same commit and Dockerfile.
  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    uses: ./.github/workflows/e2e.yml

  image:
    needs: [check, e2e]
    # `e2e` is skipped off a tag, which would skip this job too: run when it
    # was skipped or passed, never when it failed.
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.e2e.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The instance heartbeat reports this as `version`: the release tag
      # without its `v` on a tag build, the short SHA otherwise.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: noite
          platforms: ${{ matrix.platform }}
          build-args: NOITE_BUILD_VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/noite,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=noite-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=noite-${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          echo -n "$DIGEST" > "/tmp/digests/$SUFFIX"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: noite-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: noite-digest-*
          path: /tmp/digests
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/noite
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
      - run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=""
          for f in /tmp/digests/*; do
            digests="$digests $IMAGE@$(cat "$f")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/noite

  # After the image exists, so `install --pre` never finds a release whose
  # image is missing. A release made with GITHUB_TOKEN triggers no workflow,
  # so this never promotes anything by itself.
  prerelease:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: GitHub pre-release with this version's CHANGELOG notes
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists: leaving it as it is"
            exit 0
          fi
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          gh release create "$TAG" --prerelease --verify-tag --title "$TAG" --notes-file notes.md
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
