# Release image for ghcr.io: `ghcr.io/<owner>/noite`, the whole install in one
# container (docker/Dockerfile, target `noite`). Built with buildx, one
# platform per native runner, pushed by digest, then merged into a multi-arch
# manifest list.
#
# Installs never build in prod: they pull a channel tag (NOITE_IMAGE) and
# `docker compose up -d`. A new image restarts the runner and with it every
# tenant fleet (they cold-boot), so installs follow RELEASES, not main.
#
# Tags:
#   main push        `edge` + short SHA (CI and rollbacks; not an install target)
#   v* tag           the version (`0.1.0-alpha.1`), short SHA, and the channels:
#                    `alpha` for every release, `stable` for final ones only
#                    (no `-` in the tag). A `stable` install never sees an alpha.
#
# A release tag is a gate, not a trigger: the e2e lanes (`make e2e`,
# `make e2e-isolation`) and the CHANGELOG check must pass before anything is
# pushed to GHCR.
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/runner/**"
      - "apps/noite/**"
      - "docker/Dockerfile"
      - "docker/Dockerfile.dockerignore"
      - "docker/install-sidecars.sh"
      - "docker/compose.yaml"
      - ".github/workflows/images.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - name: changelog entry for this release
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun docker/check-changelog.ts "${GITHUB_REF_NAME#v}"
      - name: lint
        run: bun run check
      - name: version pins
        run: bun docker/check-versions.ts
      - name: render compose (prod, build, dev, e2e)
        run: |
          docker compose -f docker/compose.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.build.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.dev.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.e2e.yaml config > /dev/null

  # Release tags only: the same lanes the Actions tab runs by hand, as a gate.
  # The image below is built from the same commit and Dockerfile.
  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    uses: ./.github/workflows/e2e.yml

  image:
    needs: [check, e2e]
    # `e2e` is skipped off a tag, which would skip this job too: run when it
    # was skipped or passed, never when it failed.
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.e2e.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: noite
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/noite,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=noite-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=noite-${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          echo -n "$DIGEST" > "/tmp/digests/$SUFFIX"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noite-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: noite-digest-*
          path: /tmp/digests
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/noite
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=alpha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=""
          for f in /tmp/digests/*; do
            digests="$digests $IMAGE@$(cat "$f")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/noite
