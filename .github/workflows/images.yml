# Release image for ghcr.io: `ghcr.io/<owner>/noite`, the whole install in one
# container (docker/Dockerfile, target `noite`). Built with buildx, one
# platform per native runner, pushed by digest, then merged into a multi-arch
# manifest list.
#
# Installs never build in prod: they pull a channel tag (NOITE_IMAGE) and
# `docker compose up -d`. A new image restarts the runner and with it every
# tenant fleet (they cold-boot), so installs follow RELEASES, not main.
#
# Tags:
#   main push        `edge` + short SHA (CI and rollbacks; not an install target)
#   v* tag           the version (`0.1.0-alpha.1`) and short SHA, then a GitHub
#                    PRE-release with that version's CHANGELOG notes, then
#                    `@noitenow/cli` at that exact version to npm (dist-tag
#                    `alpha` for a prerelease, `latest` for a final). No channel
#                    moves: try it with `run.sh | bash -s install --pre`.
#
# A release tag is a gate, not a trigger: the e2e lanes (`make e2e`,
# `make e2e-isolation`) and the CHANGELOG check must pass before anything is
# pushed to GHCR.
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/runner/**"
      - "apps/noite/**"
      - "docker/Dockerfile"
      - "docker/Dockerfile.dockerignore"
      - "docker/install-sidecars.sh"
      - "docker/compose.yaml"
      - ".github/workflows/images.yml"
      - ".github/workflows/check.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared with `ci.yml` (`check.yml`); a release tag also needs its CHANGELOG
  # entry. The `e2e` and `image` jobs below gate on this one.
  check:
    uses: ./.github/workflows/check.yml
    with:
      changelog: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Release tags only: the full release suite on both lanes, as a gate. The
  # image below is built from the same commit and Dockerfile.
  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    uses: ./.github/workflows/e2e.yml
    with:
      suite: release

  image:
    needs: [check, e2e]
    # `e2e` is skipped off a tag, which would skip this job too: run when it
    # was skipped or passed, never when it failed.
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.e2e.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The instance heartbeat reports this as `version`: the release tag
      # without its `v` on a tag build, the short SHA otherwise.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: noite
          platforms: ${{ matrix.platform }}
          build-args: NOITE_BUILD_VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/noite,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=noite-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=noite-${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          echo -n "$DIGEST" > "/tmp/digests/$SUFFIX"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: noite-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: noite-digest-*
          path: /tmp/digests
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/noite
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
      - run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=""
          for f in /tmp/digests/*; do
            digests="$digests $IMAGE@$(cat "$f")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/noite

  # After the image exists, so `install --pre` never finds a release whose
  # image is missing. A release made with GITHUB_TOKEN triggers no workflow,
  # so this never promotes anything by itself.
  prerelease:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: GitHub pre-release with this version's CHANGELOG notes
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists: leaving it as it is"
            exit 0
          fi
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          gh release create "$TAG" --prerelease --verify-tag --title "$TAG" --notes-file notes.md
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  # Release tags only, after everything above passed: `@noitenow/cli` to npm
  # at the tag's exact version — or a logged skip when that version is
  # already published (the owner hand-publishes the first one, so the
  # bootstrap tag must stay green). OIDC trusted publishing
  # (`id-token: write`),
  # so there is no npm token to rotate or leak; the trusted-publisher entry
  # on npmjs.com names this workflow file (`images.yml`). Provenance is
  # automatic for OIDC publishes from a public repo (no `--provenance`
  # flag). `publishConfig.access: public` in the package sets visibility;
  # `--tag` keeps prereleases off `latest` without needing dist-tag rights.
  npm-cli:
    needs: prerelease
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.prerelease.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # npm >= 11.5.1 speaks OIDC; node 24 ships it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - name: build
        working-directory: packages/cli
        run: bun run build
      - name: publish at the tag's exact version
        working-directory: packages/cli
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::packages/cli is $version but the tag is $tag: bump it in the release commit (docker/check-versions.ts guards this)"
            exit 1
          fi
          # Idempotent: the owner publishes the first version by hand
          # (bootstrap), so the tag's own run must skip, not fail, when the
          # version is already on npm. Only E404 means "not published";
          # any other `npm view` failure (network, auth) fails the job.
          if view_out="$(npm view "@noitenow/cli@${version}" version 2>&1)"; then
            echo "version ${version} is already published (${view_out}): skipping"
            exit 0
          fi
          case "$view_out" in
            *E404*)
              echo "version ${version} is not on npm yet: publishing"
              ;;
            *)
              echo "::error::npm view for @noitenow/cli@${version} failed:"
              printf '%s\n' "$view_out"
              exit 1
              ;;
          esac
          case "$version" in
            *-* ) dist_tag=alpha ;;
            * ) dist_tag=latest ;;
          esac
          npm publish --tag "$dist_tag"
