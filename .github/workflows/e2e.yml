# End-to-end: Playwright (apps/noite/e2e) against the prod compose stack.
#
# Runs AFTER the images workflow and tests those exact bytes: the runner +
# caddy GHCR tags at the images-run SHA (control service and runner cell
# both pull them — nothing builds here). No test-only app code: passkeys
# use a CDP virtual authenticator, subdomains resolve via /etc/hosts.
#
# Informational only (continue-on-error): signal for the operator, never
# a merge gate.
name: e2e

on:
  workflow_run:
    workflows: ["images"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR image tag for runner + caddy (default latest)"
        default: latest

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # Informational: report, don't gate.
    continue-on-error: true
    env:
      E2E_RUNNER_TOKEN: dev-runner-token
    steps:
      - name: checkout triggering commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: images
        name: resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: bun install
        working-directory: apps/noite

      - name: install playwright browsers
        run: |
          ./node_modules/.bin/playwright install chromium
          sudo ./node_modules/.bin/playwright install-deps chromium
        working-directory: apps/noite

      # Localhost-safe defaults from the example (dev secrets are only
      # refused on real domains). Deterministic token doubles as the test
      # credential below.
      - name: write env
        run: cp .env.example .env

      - name: resolve subdomains locally
        run: echo "127.0.0.1 api.localhost git.localhost e2e.localhost" | sudo tee -a /etc/hosts

      - name: boot prod stack from GHCR
        run: make up-e2e
        env:
          NOITE_CADDY_IMAGE: ghcr.io/ryuzcorp/noite-caddy:${{ steps.images.outputs.tag }}
          NOITE_RUNNER_IMAGE: ghcr.io/ryuzcorp/noite:${{ steps.images.outputs.tag }}
        timeout-minutes: 15

      - name: build control worker bundle
        run: bun run build
        working-directory: apps/noite

      # The runner cell pulls (never builds): point dist/wrangler.json at
      # the same GHCR tag the control service runs.
      - name: point cell at GHCR image
        run: python3 -c "import json,os; p='apps/noite/dist/wrangler.json'; d=json.load(open(p)); d['containers'][0]['image']=f\"ghcr.io/ryuzcorp/noite:{os.environ['E2E_IMAGE_TAG']}\"; json.dump(d, open(p,'w'), indent=2)"
        env:
          E2E_IMAGE_TAG: ${{ steps.images.outputs.tag }}

      # The node has no published API port, so deploy from inside the
      # control container (loopback to the internal listener) with CWD at
      # the /e2e-app mount (repo apps/noite): `celld deploy` re-bundles
      # with esbuild, which resolves node_modules above the CWD. Same shape
      # as the runner's tenant deploys (celld deploy <dir> --bucket
      # --endpoint --region); D1 provisions from dist/wrangler.json.
      - name: deploy control worker
        run: |
          CID="$(docker compose -f docker/compose.yaml ps -q control)"
          docker exec -w /e2e-app "$CID" celld deploy dist \
            --bucket "s3://noite/control" \
            --endpoint http://rustfs:9000 \
            --region us-east-1
        timeout-minutes: 12

      - name: wait for healthy stack
        run: |
          for i in $(seq 1 60); do
            if make doctor; then exit 0; fi
            sleep 10
          done
          echo "stack never became healthy"
          exit 1
        timeout-minutes: 12

      # The Playwright runner is Node-only: invoke through npx (bun owns
      # installs, node owns execution).
      - name: playwright e2e
        run: npx playwright test
        working-directory: apps/noite
        timeout-minutes: 20

      - name: stack logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml logs --tail=200

      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/noite/playwright-report/
          retention-days: 14
