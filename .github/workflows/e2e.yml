# The end-to-end lanes: the production image booted in its own compose project
# and driven by Playwright (passkey signup, invites, git push, deploys, tenant
# serve), then the same lane in multi-tenant mode with the hostile-tenant spec.
#
# Two suites over the same specs (`inputs.suite`, `E2E_SUITE` in the lane):
# `fast` runs the tagged PR gate (@fast single, @isolation multi — the
# critical paths plus the policy probe); `release` runs every spec. `ci.yml`
# runs `fast` on pull requests that touch runtime code and `release` on the
# `e2e` label; `images.yml` gates every `v*` tag on `release`; a nightly
# schedule runs `release` on main. Locally: `make e2e`,
# `E2E_SUITE=fast make e2e`, and `make e2e-isolation`.
#
# Speed shape: each lane builds the image once with buildx into the local
# daemon (no per-lane from-scratch compose build) and tests it via
# E2E_IMAGE. Unchanged stages come from the GHA layer cache shared with
# `ci.yml`'s `image` job; the build's cache mounts (cargo registry and
# target/, bun's package cache) come from the Actions cache, so a source
# change recompiles the runner crate alone. Playwright then runs spec files
# in parallel (E2E_WORKERS) against the one stack.
name: e2e

on:
  workflow_call:
    inputs:
      suite:
        default: release
        description: Which spec set to run (fast = the tagged PR gate, release = every spec).
        required: false
        type: string
  workflow_dispatch:
    inputs:
      suite:
        default: release
        description: Which spec set to run (fast = the tagged PR gate, release = every spec).
        options: [release, fast]
        required: false
        type: choice
  # Nightly release-suite run on main: the tag gate only runs on `v*`, so this
  # is what catches a slow main-branch regression in a spec outside the fast
  # set. `inputs.suite` is empty on a schedule trigger; the lane step below
  # falls back to `release`.
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The two lanes boot their own stack from the same tree and share nothing,
    # so they run side by side: the gate takes as long as the slower lane
    # instead of both in a row. `fail-fast: false` keeps the other lane's
    # verdict (and its report) when one fails.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: single
            target: e2e
          # Multi-tenant mode with the image's capabilities: the
          # hostile-tenant spec proves builds and fleets cannot reach secrets
          # or internal APIs.
          - lane: multi
            target: e2e-isolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - name: install UI deps
        working-directory: apps/noite
        run: bun install --frozen-lockfile
      # Browser binaries (~170 MB) survive across runs; the install below
      # stays `--with-deps` so the OS libraries are still ensured, and it
      # skips binaries already on disk.
      - name: cache playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/noite/bun.lock') }}
          path: ~/.cache/ms-playwright
      - name: playwright chromium
        working-directory: apps/noite
        run: bunx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # The runner and UI stages compile into cache mounts, which a hosted
      # runner's throwaway builder never keeps: every lane recompiled every
      # Rust dependency (~4 min) even with the layer cache warm. Carry the
      # mounts in the Actions cache, keyed on both lockfiles, and inject them
      # into the builder; a lockfile change saves a fresh copy.
      - name: cache build mounts
        id: mounts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: build-mounts-${{ runner.os }}-${{ hashFiles('apps/runner/Cargo.lock', 'apps/noite/bun.lock') }}
          path: |
            cargo-registry
            cargo-git
            runner-target
            bun-cache
      - name: inject build mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "cargo-registry": { "target": "/usr/local/cargo/registry", "id": "noite-cargo-registry" },
              "cargo-git": { "target": "/usr/local/cargo/git", "id": "noite-cargo-git" },
              "runner-target": { "target": "/src/target", "id": "noite-runner-target" },
              "bun-cache": { "target": "/root/.bun/install/cache", "id": "noite-bun-cache" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
      # The lane's image, built once per lane straight into the daemon the
      # compose stack below uses — no second from-scratch build inside
      # `make e2e`. Same Dockerfile target and GHA cache scope as `ci.yml`'s
      # `image` job, so PR layers warm this build.
      - name: build lane image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=gha,scope=noite-linux/amd64
          cache-to: type=gha,mode=max,scope=noite-linux/amd64
          context: .
          file: docker/Dockerfile
          load: true
          tags: noite:e2e
          target: noite
      - name: e2e lane
        run: E2E_IMAGE=noite:e2e E2E_SUITE=${{ inputs.suite || 'release' }} make ${{ matrix.target }}
      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.lane }}
          path: apps/noite/playwright-report/
          retention-days: 7
