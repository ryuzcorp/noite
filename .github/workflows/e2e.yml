# The end-to-end lanes: the production image booted in its own compose project
# and driven by Playwright (passkey signup, invites, git push, deploys, tenant
# serve), then the same lane in multi-tenant mode with the hostile-tenant spec.
#
# Run by hand from the Actions tab, and by `images.yml` as the gate in front of
# every release tag. Locally: `make e2e` and `make e2e-isolation`.
name: e2e

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - name: install UI deps
        working-directory: apps/noite
        run: bun install --frozen-lockfile
      - name: playwright chromium
        working-directory: apps/noite
        run: bunx playwright install --with-deps chromium
      - name: e2e lane
        run: make e2e
      # Multi-tenant mode with the image's capabilities: the hostile-tenant
      # spec proves builds and fleets cannot reach secrets or internal APIs.
      - name: e2e isolation lane
        run: make e2e-isolation
      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/noite/playwright-report/
          retention-days: 7
