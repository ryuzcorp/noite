# Monthly oldest-beta upgrade lane: the first beta seeds live data, then the
# tree image restarts on the SAME volumes and bucket and proves the seed
# reads back. The nightly lane (upgrade.yml) only covers previous-release
# -> tree, so a beta.1 -> tree jump would otherwise never run: anything the
# intermediate betas already migrated is never exercised as a migration.
# No retries anywhere: a failure is a finding.
name: upgrade-oldest

on:
  workflow_dispatch:
  # Monthly: the jump is slow-moving (one beta series), so monthly proves it
  # without paying a second 40-minute lane every night.
  schedule:
    - cron: "0 7 1 * *"

permissions:
  contents: read

jobs:
  upgrade-oldest:
    name: upgrade lane (first beta -> tree)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/upgrade.yml
    with:
      from_oldest: "1"
