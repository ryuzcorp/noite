# Shared pull-request / release gate, extracted so `ci.yml` (pull requests)
# and `images.yml` (before a release image) cannot drift: lint and formatting,
# version-pin drift, every compose variant renders, every script parses, the
# runner schema applies twice, and the CLI builds and smoke-runs.
#
# `changelog: true` (release tags only) additionally requires a CHANGELOG
# entry for the tag being built.
name: check

on:
  workflow_call:
    inputs:
      changelog:
        description: "Require a CHANGELOG entry for this release tag"
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # ~3x the 0.7 min p95 (50 runs, 2026-11-11), floor 10: the 2026-11-11
    # merge queue hung here in `bun install` for 40+ min on GitHub's default.
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
      # The image-pin paths-filter lists a pull request's files through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 3
      - run: bun install
        timeout-minutes: 5
      - name: changelog entry for this release
        if: ${{ inputs.changelog }}
        run: bun docker/check-changelog.ts "${GITHUB_REF_NAME#v}"
      - name: lint and format
        run: bun run check
      - name: version pins
        run: bun docker/check-versions.ts ${{ inputs.changelog && '--release' || '' }}
      # check-versions.ts proves the celld tag names a fork release and the
      # image is pulled by digest; this proves the pinned digest is what
      # that tag resolves to, not a stale or rewritten one.
      - name: celld pin is published
        run: |
          tag=$(sed -n 's/^ARG CELLD_VERSION=//p' docker/Dockerfile)
          pinned=$(sed -n 's/^ARG CELLD_DIGEST=//p' docker/Dockerfile)
          published=$(docker buildx imagetools inspect "ghcr.io/ryuzcorp/celld:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ "$published" != "$pinned" ]; then
            echo "::error::docker/Dockerfile pins celld $tag at $pinned, but ghcr.io/ryuzcorp/celld:$tag is $published"
            exit 1
          fi
      # The fork attests every image it publishes (ryuzcorp/celld publish.yml,
      # SLSA provenance on the multi-arch index): verify the pinned digest
      # carries that attestation, so the pin can only name an image the fork
      # built.
      - name: celld pin attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG CELLD_DIGEST=//p' docker/Dockerfile)
          gh attestation verify "oci://ghcr.io/ryuzcorp/celld@$pinned" --repo ryuzcorp/celld
      # Every other image and tarball pin, against the publisher: Node's
      # signed SHASUMS256.txt, npm's dist.integrity and the GitHub release
      # asset digest are immutable for a version, so a bump that changes a
      # version but not its checksum always fails here. Image tags are not
      # immutable (an official image re-pushes the same tag for a base-OS
      # update), so their digests are resolved only for a PR that changes a
      # pin; `.github/workflows/pin-drift.yml` runs that leg weekly and files
      # an issue instead of failing unrelated PRs. The merge queue and the
      # release builds (`images.yml`, a push or tag with no PR file list)
      # deliberately skip the image leg: the build consumes the digest the
      # pin already carries, so a re-pushed tag cannot change what ships,
      # and the weekly job is what notices drift.
      - name: image pin files changed
        id: pins
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            image:
              - 'docker/Dockerfile'
              - 'docker/compose.yaml'
              - '.github/workflows/ci.yml'
              - 'apps/website/docs/self-hosting/platforms.mdx'
      - name: image and tarball pins are published
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun docker/check-versions.ts --online ${{ steps.pins.outputs.image == 'true' && '--online-images' || '' }}
      # Script unit tests: docker/ (including the test-hygiene checker,
      # docker/check-tests.test.ts) and the CI scripts (bun skips dot
      # directories unless they're named explicitly).
      - name: docker and CI script tests
        run: bun test docker/ ./.github/scripts/
      # Test hygiene: no retries anywhere, no wall-clock sleeps in tests.
      - name: test hygiene (no retries, no sleeps)
        run: bun docker/check-tests.ts
      # Worker rules: no cross-request shared async work without a waitUntil
      # registration, no unbounded store reads (flake H).
      - name: worker rules (no shared orphans, no unbounded reads)
        run: bun docker/check-worker-rules.ts
      # `config` needs no daemon, so a broken compose file fails here instead
      # of on someone's server. Every variant, including the test overlays.
      - name: render compose (prod, build, dev, e2e, multi)
        run: |
          docker compose -f docker/compose.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.build.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.dev.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.e2e.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.multi.yaml config > /dev/null
      # The runner prints tenant URLs from its own env: both public ports
      # must reach the container, or prod links a dev-default port (the
      # first-push note once printed :9443 on a :443 install).
      - name: runner sees both public ports
        run: |
          docker compose -f docker/compose.yaml config | grep -qE "HTTP_PORT: ['\"]?9080['\"]?"
          docker compose -f docker/compose.yaml config | grep -qE "HTTPS_PORT: ['\"]?9443['\"]?"
          HTTPS_PORT=443 docker compose -f docker/compose.yaml config | grep -qE "HTTPS_PORT: ['\"]?443['\"]?"
          HTTP_PORT=8090 HTTPS_PORT=8443 docker compose -f docker/compose.yaml -f docker/compose.e2e.yaml config | grep -qE "HTTPS_PORT: ['\"]?8443['\"]?"
      # Parse each script with its shebang's shell: `sh` is dash here, and
      # install.sh/uninstall.sh are bash.
      - name: shell scripts parse
        run: |
          for f in docker/*.sh; do
            case "$(head -n1 "$f")" in
            *bash*) bash -n "$f" ;;
            *) sh -n "$f" ;;
            esac
          done
      # Main-database tables only: app_metric, metric_watermark and the rest of
      # the telemetry live in metrics.sqlite (apps/runner/schema.metrics.sql).
      # Strict: the rendered table list must equal the allowlist exactly, so a
      # migration that adds a table without updating this list fails here
      # instead of going unchecked (the alpha.4/alpha.5 tables were silently
      # skipped by the old existence-only loop).
      - name: runner schema applies twice (idempotent)
        run: |
          rm -f /tmp/schema.db
          sqlite3 /tmp/schema.db < apps/runner/schema.sql
          sqlite3 /tmp/schema.db < apps/runner/schema.sql
          sqlite3 /tmp/schema.db "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" > /tmp/tables.txt
          diff /tmp/tables.txt - <<'EOF'
          app
          app_branch_rule
          app_domain
          app_env
          app_event
          app_ingest_key
          app_insight
          app_limit
          app_purge
          app_user_prop
          deploy
          environment
          environment_env
          fleet_operator_token
          instance_setting
          pr_comment
          pr_review
          pull_request
          scoped_credential
          telemetry_replay
          void_cohost_hash
          EOF

  # The UI's runner contract is generated from the Rust structs (apps/runner
  # `#[ts(export)]` derives -> apps/noite/src/lib/runner-types). A Rust change
  # that is not regenerated would ship a stale contract, so regenerate and
  # fail on any diff there. Both callers (ci.yml on PRs, images.yml on main
  # and release tags) get it, which is why it lives in this shared workflow
  # rather than ci.yml's `rust` job.
  types:
    runs-on: ubuntu-latest
    # ~3x the 1.4 min p95 (50 runs, 2026-11-11), floor 10.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The Rust workspace lives at apps/runner, not the repo root.
          workspaces: apps/runner
      - name: regenerate TypeScript bindings
        run: cargo test --locked export_bindings
      - name: generated types are committed and current
        working-directory: .
        run: |
          git diff --exit-code -- apps/noite/src/lib/runner-types
          test -z "$(git status --porcelain apps/noite/src/lib/runner-types)"

  # The control UI's unit tests, from a checkout: among them the guard that
  # every `/api/...` path the browser requests has a committed route file
  # (alpha.6 shipped without the logs stream route because `.gitignore` hid
  # it, and only a git checkout shows that). `apps/noite` has its own
  # lockfile, installed standalone like the image does. `bun run test` runs
  # each file isolated: a `mock.module` is process-wide otherwise, and the
  # checkout's file order decided which later file saw it.
  ui:
    runs-on: ubuntu-latest
    # ~3x the 0.9 min p95 (50 runs, 2026-11-11), floor 10.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 3
      - run: bun install
        timeout-minutes: 5
      - name: install UI deps
        working-directory: apps/noite
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: unit tests
        working-directory: apps/noite
        run: bun run test

  # packages/cli ships to npm but no other lane builds it: guard the bundle,
  # the typecheck, and the version it advertises (inlined from package.json).
  cli:
    runs-on: ubuntu-latest
    # ~3x the 0.4 min p95 (50 runs, 2026-11-11), floor 10.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 3
      - run: bun install
        timeout-minutes: 5
      - name: build
        working-directory: packages/cli
        run: bun run build
      - name: smoke (--version, --help)
        working-directory: packages/cli
        run: |
          node dist/bin.js --version
          node dist/bin.js --help
      - name: typecheck
        run: bunx tsc --noEmit -p packages/cli
      - name: unit tests
        working-directory: packages/cli
        run: bun test
