# Shared pull-request / release gate, extracted so `ci.yml` (pull requests)
# and `images.yml` (before a release image) cannot drift: lint and formatting,
# version-pin drift, every compose variant renders, every script parses, the
# runner schema applies twice, and the CLI builds and smoke-runs.
#
# `changelog: true` (release tags only) additionally requires a CHANGELOG
# entry for the tag being built.
name: check

on:
  workflow_call:
    inputs:
      changelog:
        description: "Require a CHANGELOG entry for this release tag"
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - name: changelog entry for this release
        if: ${{ inputs.changelog }}
        run: bun docker/check-changelog.ts "${GITHUB_REF_NAME#v}"
      - name: lint and format
        run: bun run check
      - name: version pins
        run: bun docker/check-versions.ts
      # `config` needs no daemon, so a broken compose file fails here instead
      # of on someone's server. Every variant, including the test overlays.
      - name: render compose (prod, build, dev, e2e)
        run: |
          docker compose -f docker/compose.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.build.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.dev.yaml config > /dev/null
          docker compose -f docker/compose.yaml -f docker/compose.e2e.yaml config > /dev/null
      # The runner prints tenant URLs from its own env: both public ports
      # must reach the container, or prod links a dev-default port (the
      # first-push note once printed :9443 on a :443 install).
      - name: runner sees both public ports
        run: |
          docker compose -f docker/compose.yaml config | grep -qE "HTTP_PORT: ['\"]?9080['\"]?"
          docker compose -f docker/compose.yaml config | grep -qE "HTTPS_PORT: ['\"]?9443['\"]?"
          HTTPS_PORT=443 docker compose -f docker/compose.yaml config | grep -qE "HTTPS_PORT: ['\"]?443['\"]?"
          HTTP_PORT=8090 HTTPS_PORT=8443 docker compose -f docker/compose.yaml -f docker/compose.e2e.yaml config | grep -qE "HTTPS_PORT: ['\"]?8443['\"]?"
      # Parse each script with its shebang's shell: `sh` is dash here, and
      # install.sh/uninstall.sh are bash.
      - name: shell scripts parse
        run: |
          for f in docker/*.sh; do
            case "$(head -n1 "$f")" in
            *bash*) bash -n "$f" ;;
            *) sh -n "$f" ;;
            esac
          done
      # Main-database tables only: app_metric, metric_watermark and the rest of
      # the telemetry live in metrics.sqlite (apps/runner/schema.metrics.sql).
      # Strict: the rendered table list must equal the allowlist exactly, so a
      # migration that adds a table without updating this list fails here
      # instead of going unchecked (the alpha.4/alpha.5 tables were silently
      # skipped by the old existence-only loop).
      - name: runner schema applies twice (idempotent)
        run: |
          rm -f /tmp/schema.db
          sqlite3 /tmp/schema.db < apps/runner/schema.sql
          sqlite3 /tmp/schema.db < apps/runner/schema.sql
          sqlite3 /tmp/schema.db "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" > /tmp/tables.txt
          diff /tmp/tables.txt - <<'EOF'
          app
          app_branch_rule
          app_credential
          app_domain
          app_env
          app_event
          app_insight
          app_limit
          app_user_prop
          deploy
          environment
          environment_env
          instance_setting
          pr_comment
          pr_review
          pull_request
          telemetry_replay
          EOF

  # The UI's runner contract is generated from the Rust structs (apps/runner
  # `#[ts(export)]` derives -> apps/noite/src/lib/runner-types). A Rust change
  # that is not regenerated would ship a stale contract, so regenerate and
  # fail on any diff there. Both callers (ci.yml on PRs, images.yml on main
  # and release tags) get it, which is why it lives in this shared workflow
  # rather than ci.yml's `rust` job.
  types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The Rust workspace lives at apps/runner, not the repo root.
          workspaces: apps/runner
      - name: regenerate TypeScript bindings
        run: cargo test --locked export_bindings
      - name: generated types are committed and current
        working-directory: .
        run: |
          git diff --exit-code -- apps/noite/src/lib/runner-types
          test -z "$(git status --porcelain apps/noite/src/lib/runner-types)"

  # packages/cli ships to npm but no other lane builds it: guard the bundle,
  # the typecheck, and the version it advertises (inlined from package.json).
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - name: build
        working-directory: packages/cli
        run: bun run build
      - name: smoke (--version, --help)
        working-directory: packages/cli
        run: |
          node dist/bin.js --version
          node dist/bin.js --help
      - name: typecheck
        run: bunx tsc --noEmit -p packages/cli
