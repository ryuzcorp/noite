[package]
name = "noite-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-jrpc = "0.9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
hmac = "0.13"
anyhow = "1"
libc = "0.2"
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
rand = "0.10"
thiserror = "2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
async-trait = "0.1"
constant_time_eq = "0.6"
regex = "1"
base64 = "0.23"
zstd = "0.14"
# celld's telemetry objects are plain flat Parquet (zstd). The native
# column/record API is enough — no `arrow` feature, which would pull the whole
# arrow crate stack into the runner image. Pinned to celld's version so the
# format reader matches its writer exactly.
parquet = { version = "59.2.0", default-features = false, features = ["zstd"] }
rusty-s3 = "0.11.0"
# Per-deploy source maps for error symbolication (host/sourcemaps.rs):
# getsentry's parser/composer (BSD-3-Clause, like the repo's other permissive
# deps). Pinned by the lockfile; `cargo build --locked` enforces it.
sourcemap = "9"
# Generates the TypeScript bindings the UI consumes (apps/noite/src/lib/runner-types)
# from the structs that cross the JSON boundary. `no-serde-warnings` silences
# warnings for serde attrs ts-rs does not model (e.g. `alias`).
ts-rs = { version = "12", features = ["no-serde-warnings"] }
hickory-resolver = "0.26.3"
argon2 = "0.6.0"
# Per-fleet engine proxy (`host::sandbox::engine`): a unix-socket HTTP/1.1
# forwarder with exec-stream upgrades. Already transitive via axum/reqwest;
# pinned to the locked versions so `cargo build --locked` holds.
hyper = { version = "1.12", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
# The Noite CI engine (`noite.ci.yaml`): parser + container runner shared
# from ryuzcorp/crates (Apache-2.0).
ryuz_workflow = "0.1"
# S3-backed git WAL (manifest CAS + bundle mirror) shared from ryuzcorp/crates
# (Apache-2.0).
ryuz_git = { version = "0.2", default-features = false }

[dev-dependencies]
# `time::pause`/`advance` for the DNS-timeout test; tests only.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
