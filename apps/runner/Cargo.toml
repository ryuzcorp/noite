[package]
name = "noite-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-jrpc = "0.9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
hmac = "0.12"
anyhow = "1"
libc = "0.2"
aes-gcm = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
thiserror = "2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
constant_time_eq = "0.3"
regex = "1"
base64 = "0.22"
zstd = "0.13"
rusty-s3 = "0.10.2"
# Generates the TypeScript bindings the UI consumes (apps/noite/src/lib/runner-types)
# from the structs that cross the JSON boundary. `no-serde-warnings` silences
# warnings for serde attrs ts-rs does not model (e.g. `alias`).
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
