minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.69.0"
  - "@cloudflare/workerd-darwin-64@1.20261110.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261110.1"
  - "@cloudflare/workerd-linux-64@1.20261110.1"
  - "@cloudflare/workerd-linux-arm64@1.20261110.1"
  - "@cloudflare/workerd-windows-64@1.20261110.1"
  - miniflare@5.20261110.0-beta
  - workerd@1.20261110.1
  - wrangler@4.160.0
  - vite@8.3.8

# pnpm 10+ fails a CI install on dependency build scripts nobody approved.
# Neither is needed to build: esbuild ships its binary as an optional
# platform package, and workerd only runs under `vite dev`.
allowBuilds:
  esbuild: false
  workerd: false
